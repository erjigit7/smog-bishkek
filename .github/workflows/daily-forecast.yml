# Daily morning forecast for tomorrow (roadmap item 6), see smog/forecast.py.
# Commits forecasts/forecasts.csv: each new forecast, and later what actually happened.
# Posts the forecast to the Telegram channel (secrets TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL; smog/telegram.py).
name: Daily smog forecast

on:
  schedule:
    # 03:45 UTC = 09:45 Bishkek: sensor.community publishes yesterday's archive at ~03:30 UTC.
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forecast even outside the heating season (the model only knows Nov-Feb)"
        type: boolean
        default: false
      test_date:
        description: "Test post: a past date, e.g. 2026-01-20. Posts that day's forecast to Telegram marked TEST, saves nothing"
        type: string
        default: ""

permissions:
  contents: write

concurrency: daily-forecast

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Forecast and post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          FORCE: ${{ inputs.force }}
          TEST_DATE: ${{ inputs.test_date }}  # via env, not pasted into the command line
        run: |
          if [ -n "$TEST_DATE" ]; then
            python -m smog.forecast --date "$TEST_DATE" --test-send
          elif [ "$FORCE" = "true" ]; then
            python -m smog.forecast --force
          else
            python -m smog.forecast
          fi
      - name: Commit forecasts
        if: always()  # also after a failed forecast: keeps the verification and the "no forecast" row
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/forecasts.csv
          git diff --cached --quiet || (git commit -m "Forecast $(date -u +%F)" && git push)
